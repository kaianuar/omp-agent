# Ponytail Configuration for omp-agent

version: "1.0"

project:
  name: "omp-agent"
  description: "Oh My Pi agent pipeline — automated AI agent orchestration with quality gates"
  language: "TypeScript"

agents:
  - cursor
  - opencode
  - claude-code
  - codex
  - devin
  - qoder
  - kiro
  - grok
  - grok-code-fast
  - cline
  - openclaw

directories:
  agents: ".agents"
  skills: ".agents/skills"
  rules: ".agents/rules"
  contexts: ".agents/contexts"
  templates: ".agents/templates"

skills:
  - name: "write-test"
    description: "Write a test following TDD and AAA pattern"
    template: "templates/write-test.md"
  
  - name: "refactor"
    description: "Refactor code following Karpathy principles"
    template: "templates/refactor.md"
  
  - name: "write-docs"
    description: "Write documentation following project conventions"
    template: "templates/write-docs.md"

rules:
  - id: "karpathy-explicit"
    description: "Explicit > Implicit — no magic, no hidden behavior"
    severity: error
    
  - id: "karpathy-types"
    description: "Types everywhere — type hints on all functions, no any/any without comment"
    severity: error
    
  - id: "karpathy-small-functions"
    description: "Small functions — one thing per function, <50 lines ideal"
    severity: warning
    
  - id: "karpathy-no-cleverness"
    description: "No cleverness — boring code > clever code"
    severity: warning
    
  - id: "karpathy-explicit-errors"
    description: "Explicit error handling — no bare catch/except"
    severity: error
    
  - id: "karpathy-tests-as-docs"
    description: "Tests as documentation — names describe behavior"
    severity: error
    
  - id: "ponytail-hexagonal"
    description: "Hexagonal architecture — domain at center, adapters at edges"
    severity: error
    
  - id: "ponytail-dependency-inversion"
    description: "Dependency inversion — domain depends on abstractions"
    severity: error
    
  - id: "ponytail-typescript-strict"
    description: "Strict TypeScript — strict: true, noImplicitAny: true"
    severity: error
    
  - id: "ponytail-conventional-commits"
    description: "Conventional commits (feat:, fix:, refactor:, test:, docs:, chore:, perf:)"
    severity: error
    
  - id: "ponytail-tdd"
    description: "TDD mandatory — test first, then implement, then refactor"
    severity: error
    
  - id: "ponytail-one-change-per-commit"
    description: "One logical change per commit"
    severity: error
    
  - id: "ponytail-no-any"
    description: "No any/any without comment"
    severity: error
    
  - id: "ponytail-no-bare-catch"
    description: "No bare catch/except"
    severity: error
    
  - id: "ponytail-no-magic"
    description: "No magic numbers/strings — named constants"
    severity: warning
    
  - id: "ponytail-explicit-errors"
    description: "Explicit error handling with context"
    severity: error

ide:
  cursor:
    rules_dir: ".cursor/rules"
  opencode:
    rules_dir: ".opencode/rules"
  claude-code:
    rules_dir: ".claude-plugin/rules"
  codex:
    rules_dir: ".codex-plugin/rules"

validation:
  pre_commit: true
  ci: true
  gates:
    - gate0_plan_review
    - gate1_tests
    - gate2_adversarial_review
    - gate3_visual_e2e

version_info:
  ponytail_version: "1.0"
  generated_by: "omp-agent scaffold.sh"
  generated_at: "2026-08-16"